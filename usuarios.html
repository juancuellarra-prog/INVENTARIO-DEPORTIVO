<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perfil</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="api.js"></script>
<script src="usuarios.js"></script>

</head>

<body>

<!-- HEADER -->
<header class="header">

    <!-- BUSCADOR -->
    <form class="search">

        <i class="lupa fa-solid fa-magnifying-glass"></i>

        <input
        type="text"
        placeholder="Buscar"
        class="buscar">

    </form>

    <!-- TITULO -->
    <h1>Cuellar Sport</h1>

    <!-- MENU -->
    <i class="menu fa-solid fa-bars"></i>

</header>

<!-- CONTENEDOR -->
<div class="contenedor">

<!-- SIDEBAR -->
<aside class="sidebar">

    <img class="login-logo"
    src="img/logo.png"
    alt="Inicio">

    <h2>Cuellar Sport</h2>

    <a href="dashboard.html">
        Inicio
    </a>

    <a href="productos.html">
        Productos
    </a>

    <a href="usuarios.html" class="active">
        Usuarios
    </a>

    <form action="index.html">

        <button
        type="submit"
        class="logout">

            Cerrar sesión

        </button>

    </form>

</aside>

<!-- MAIN -->
<main class="main">

    <h1>Perfil</h1>

    <a href="agregar-usuario.html"
    class="btn">

        Agregar usuario

    </a>

    <table>

        <thead>

            <tr>

                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>

            </tr>

        </thead>

        <tbody id="usuarios-tbody">

        </tbody>

    </table>

</main>

</div>
