<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agregar Producto</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="agregar-producto.js"></script>
</head>

<body>

<div class="contenedor">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <img class="login-logo" src="img/logo.png" alt="Inicio">

        <h2>Cuellar Sport</h2>

        <a href="dashboard.html">Inicio</a>
        <a href="productos.html" class="active">Productos</a>
        <a href="usuarios.html">Usuarios</a>

        <form action="index.html">
            <button type="submit" class="logout">
                Cerrar sesión
            </button>
        </form>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <h1>Agregar Producto</h1>

        <form id="add-form">

            <input type="text" id="nombre" placeholder="Nombre producto" required>
            <br><br>

            <input type="text" id="categoria" placeholder="Categoría" required>
            <br><br>

            <input type="number" id="stock" placeholder="Cantidad" required>
            <br><br>

            <input type="number" step="0.01" id="precio" placeholder="Precio" required>
            <br><br>

            <button type="submit" class="btn">Guardar</button>

        </form>

    </main>

</div>

</body>
</html>
