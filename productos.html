<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Productos</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="api.js"></script>
<script src="productos.js"></script>

</head>

<body>

<!-- HEADER -->
<header class="header">

    <!-- BUSCADOR -->
    <form class="search">

        <i class="lupa fa-solid fa-magnifying-glass"></i>

        <input
        type="text"
        placeholder="Buscar"
        class="buscar">

    </form>

    <!-- TITULO -->
    <h1>Cuellar Sport</h1>

    <!-- MENU -->
    <i class="menu fa-solid fa-bars"></i>

</header>

<!-- CONTENEDOR -->
<div class="contenedor">

<!-- SIDEBAR -->
<aside class="sidebar">

    <img class="login-logo" src="img/logo.png" alt="Logo">

    <h2>Cuellar Sport</h2>

    <a href="dashboard.html">
        Inicio
    </a>

    <a href="productos.html" class="active">
        Productos
    </a>

    <a href="usuarios.html">
        Usuarios
    </a>
    <form action="index.html">
        <button type="submit" class="logout">Cerrar sesión</button>
    </form>

</aside>

<!-- MAIN -->
<main class="main">

    <h1>Gestión de Productos</h1>

    <a href="agregar-producto.html"
    class="btn">

        agregar producto

    </a>

    <table>

        <thead>

            <tr>

                <th>ID</th>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Acciones</th>

            </tr>

        </thead>

        <tbody id="productos-tbody">

        </tbody>

</main>

</div>

</body>
</html>
