<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="style.css">
<link rel="shortcut icon" href="img/logo.png" type="img/png" sizes="16x16">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel ="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <img class="icono" src="img/logo.png" alt="Logo de Cuellar Sport" sizes="16x16">
        <h1>Cuellar Sport</h1>
        <i class="menu fa-solid fa-bars"></i>
    </header>
    <main>
        <div class="login-container">
            <img class="login-logo" src="img/logo.png" alt="Inicio">
            <h2>CUELLAR SPORT</h2>
            <p>Sistema de Inventario Deportivo</p>
            <form id="login-form">
                <input type="email" id="correo" placeholder="Correo electrónico" required>
                <input type="password" id="contraseña" placeholder="Contraseña" required>
                <button type="submit">Ingresar</button>
            </form>
        </div>

    </main>
    <script src="api.js"></script>
    <script src="login.js"></script>
</body>
</html>
